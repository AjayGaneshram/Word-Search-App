name: Deploy to Public-Repo

on:
  push:
    branches:
      - main  # Change this to your default branch if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}  # Use the token from your GitHub secrets

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Change this to match your Node.js version

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Check if dist folder exists
        run: ls -l dist  # Verify build output

      - name: Clone public repository
        run: |
          git clone https://github.com/AjayGaneshram/BuildRepo.git public-repo
          cd public-repo
          git config --global user.email "rkgganeshram@gmail.com"
          git config --global user.name "AjayGaneshram"

      - name: Ensure latest state from public repository
        run: |
          cd public-repo
          git fetch origin main
          git reset --hard origin/main  # Reset local branch to remote
          git pull origin main --rebase  # Ensure we have the latest changes

      - name: Copy dist folder to public repository
        run: |
          cp -r ./dist/* public-repo/  # Copy build files

      - name: Commit and push changes to public repository
        run: |
          cd public-repo
          git add .
          git commit -m "Deploy new build from private repo" || echo "No changes to commit"
          git push https://github-actions:${{ secrets.GH_PAT }}@github.com/AjayGaneshram/BuildRepo.git main --force
