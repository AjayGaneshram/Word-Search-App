<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Preserve the current path, query string, and hash
    const currentUrl = window.location.pathname + window.location.search + window.location.hash;

    // Redirect to index.html but keep the current URL in the address bar
    window.history.replaceState(null, '', currentUrl);

    // Load the React app by fetching index.html
    window.location.replace('/Word-Search-App/index.html');
  </script>
</head>
<body>
  <p>If you are not redirected automatically, <a href="/Word-Search-App/index.html">click here</a>.</p>
</body>
</html>
